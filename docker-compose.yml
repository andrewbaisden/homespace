services:
  postgres:
    image: postgres:16-alpine
    container_name: homespace-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: homespace
      POSTGRES_PASSWORD: homespace
      POSTGRES_DB: homespace
    volumes:
      - homespace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homespace -d homespace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homespace_pg_data:
